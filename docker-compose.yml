version: '3.8'

services:
  tourism-app:
    image: bbizin1004/tourism-app:latest
    container_name: tourism-container
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul  # 환경 변수 추가
      - JAVA_OPTS=-Duser.timezone=Asia/Seoul  #JVM 시간대 설정 추가
    command: [ "java", "-Duser.timezone=Asia/Seoul", "-jar", "app.jar" ]
